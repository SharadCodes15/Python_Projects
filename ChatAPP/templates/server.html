<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatApp</title>
        <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Arial', sans-serif;
}

/* Navbar container styling */
.navbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background-color: #333;
    padding: 15px 30px;
    color: white;
}

/* Title styling */
.nav-title {
    font-size: 24px;
    font-weight: bold;
    letter-spacing: 1px;
}
.cont{
    height:90vh;
    display:flex;
    justify-content:center;
    align-items:flex-end;
    background:#f4f6f9;
}

.chat-box{
    display:flex;
    align-items:center;
    width:500px;
    max-width:90%;
    background:#fff;
    border-radius:50px;
    padding:10px;
    box-shadow:0 8px 20px rgba(0,0,0,0.15);
}

.chat-box input{
    flex:1;
    border:none;
    outline:none;
    padding:12px 18px;
    font-size:16px;
    background:transparent;
}

.chat-box button{
    border:none;
    background:#0078ff;
    color:#fff;
    padding:12px 22px;
    border-radius:30px;
    cursor:pointer;
    font-size:15px;
    transition:.3s;
}

.chat-box button:hover{
    background:#005fd1;
}
.chat{
    margin:10px;
}
    </style>
</head>
<body onload="init()">
    <nav class="navbar">
        <!-- Website Title / Logo -->
        <div class="nav-title">MyWebsite</div>
        
        <!-- Navigation Links -->
    </nav>

    <div class="chat" id="chat">

    </div>

<div class="cont">


    <div class="chat-box">
        <input type="text" id='msg' placeholder="Type your message...">
        <button onclick="send()">Send</button>
    </div>
</div>

<script>
    let name =''
    function init(){
        name = prompt("Enter the name") 
    }
    const socket = io()
    socket.on("connect",()=>{
        console.log("Connected")
    })
    function send(){
        const msg = document.getElementById("msg").value;
        socket.emit("send_message",{
            user:name,
            text:msg
        });
        document.getElementById('msg').value='';
    }
    socket.on("receive_message",(data)=>{
        document.getElementById('chat').innerHTML +="<p><b>"+data.user+"</b>: "+data.text+"</p>";

    })
</script>
</body>
</html>
